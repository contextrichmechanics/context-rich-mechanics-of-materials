<text x="1000" y="595" class="title">Geometry definitions</text>
<text x="1000" y="650" class="small">A = (0,0); B = (0,-h)</text>
<text x="1000" y="688" class="small">C = (a,0); D = (L,0)</text>
<text x="1000" y="726" class="small">h = a tan(theta)</text>
<text x="1000" y="764" class="small">ell_b = a / cos(theta)</text>
<text x="1000" y="802" class="small">A: in-plane pin; B: fixed anchor</text>
<text x="1000" y="840" class="small">Boom continuous through C</text>
<text x="1000" y="878" class="small">No chain-transmitted couple</text>
<text x="1000" y="916" class="small">Current-input table governs</text>
<text x="45" y="990" class="title">Connection topology at C (givens only)</text>
<text x="70" y="1030" class="">n_s = 1: single shear</text>
<rect x="190" y="1060" width="40" height="100" fill="#a9c1d5" stroke="#344f68" stroke-width="2"/>
