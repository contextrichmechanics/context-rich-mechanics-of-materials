<path d="M1496 365 A26 26 0 1 1 1470 339" class="force"/>
<text x="1005" y="388" class="small">C_e = -H e_H, CW</text>
<text x="1000" y="470" class="small">If H = 0, both actions vanish.</text>
<text x="1000" y="505" class="small">If e_H = 0, only couple vanishes.</text>
<rect x="35" y="530" width="915" height="415" rx="8" class="box"/>
