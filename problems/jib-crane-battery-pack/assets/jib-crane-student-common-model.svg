<line x1="810" y1="247" x2="810" y2="330" class="force" />
<text x="825" y="316" class="">P</text>
<text x="1000" y="130" class="title">Prescribed loads at D</text>
<text x="1000" y="180" class="">Rightward</text>
<line x1="1030" y1="205" x2="1180" y2="205" class="force" />
<text x="1230" y="212" class="">H_x = +H</text>
<path d="M1496 230 A26 26 0 1 0 1470 256" class="force"/>
<text x="1005" y="253" class="small">C_e = +H e_H, CCW</text>
