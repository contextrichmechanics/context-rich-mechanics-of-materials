text x="870" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">L_AB</text><line x1="520" y1="680" x2="520" y2="840" stroke="#a8b4bc" stroke-width="1.5"/><line x1="1220" y1="680" x2="1220" y2="840" stroke="#a8b4bc" stroke-width="1.5"/><line x1="660" y1="680" x2="660" y2="758" stroke="#a8b4bc" stroke-width="1.5"/><text x="750" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#23323b">A below H; B below C.  L_DC = x_DH + x_HC; L_AB = x_HC; 0 &lt; x_P &lt; L_AB.</text></svg>
