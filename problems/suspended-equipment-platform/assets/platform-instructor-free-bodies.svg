<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="Instructor free bodies of lower AB and upper DC"><title>Instructor free bodies of lower AB and upper DC</title><rect width="1500" height="1000" fill="white"/><defs><marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,4 L0,0 L0,8 Z" fill="#547184"/></marker><marker id="force" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b84f25"/></marker></defs><text x="750" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#23323b">Instructor free bodies - schematic / not to scale</text><text x="750" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#23323b">Upward forces and counterclockwise moments are positive</text><text x="130" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#23323b">AB</text><line x1="300" y1="230" x2="1300" y2="230" stroke="#164a68" stroke-width="16"/><circle data-node="A" cx="300" cy="230" r="7" fill="#142b38"/><text x="270" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#23323b">A</text><circle data-node="B" cx="1300" cy="230" r="7" fill="#142b38"/><text x="1330" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#23323b">B</text><line x1="300" y1="225" x2="300" y2="115" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="300" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_AH</text><line x1="1300" y1="225" x2="1300" y2="115" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="1300" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_BC</text><line x1="500" y1="230" x2="500" y2="345" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="540" y="324" text-anchor="start" font-family="Arial, sans-serif" font-size="31" fill="#b84f25">P</text><line x1="300" y1="385" x2="500" y2="385" stroke="#547184" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="400" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">x_P</text><line x1="300" y1="455" x2="1300" y2="455" stroke="#547184" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="800" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">L_AB</text><text x="1040" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#23323b">All forces act at attachment nodes.</text><text x="130" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#23323b">DC</text><line x1="300" y1="630" x2="1300" y2="630" stroke="#164a68" stroke-width="16"/><circle data-node="D" cx="300" cy="630" r="7" fill="#142b38"/><text x="270" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#23323b">D</text><circle data-node="H" cx="585" cy="630" r="7" fill="#142b38"/><text x="557" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#23323b">H</text><circle data-node="C" cx="1300" cy="630" r="7" fill="#142b38"/><text x="1330" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#23323b">C</text><line x1="300" y1="625" x2="300" y2="515" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_ED</text><line x1="1300" y1="625" x2="1300" y2="515" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="1300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_FC</text><line x1="585" y1="635" x2="585" y2="740" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="535" y="766" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_AH</text><line x1="1300" y1="635" x2="1300" y2="740" stroke="#b84f25" stroke-width="5" marker-end="url(#force)"/><text x="1365" y="766" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#23323b">T_BC</text><text x="915" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#23323b">Both C forces share one application point.</text><line x1="300" y1="800" x2="585" y2="800" stroke="#547184" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="440" y="834" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">x_DH</text><line x1="585" y1="800" x2="1300" y2="800" stroke="#547184" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="940" y="834" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">x_HC</text><line x1="300" y1="885" x2="1300" y2="885" stroke="#547184" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="800" y="922" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#405e72">L_DC</text><text x="750" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#23323b">Symbols are not solved magnitudes. Use the current assigned data and instructor results.</text></svg>
