<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">Instructor reference: hypothetical circular local check</title><desc id="desc">Schematic, not to scale. Current P, d, t, s, and b are supplied alongside the figure. Plate and blocks extend beyond the whole circular footprint into the page. The plate is intact. One complete imaginary cylindrical shear wall surrounds the circular contact disk.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#253b50"/></marker><style>text{font-family:Arial,sans-serif;fill:#172c40;font-size:21px}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#425b70}.panel{fill:#f8fafc;stroke:#b7c6d2;stroke-width:2}.line,.dim{stroke:#253b50;stroke-width:2.5;fill:none}.symbol{font-size:26px;font-style:italic}.small{font-size:18px}.center{stroke:#95a7b7;stroke-dasharray:8 6;stroke-width:1.5}.wall{stroke:#07816e;stroke-width:3;stroke-dasharray:8 5;fill:none}.block{fill:#d4dce3;stroke:#253b50;stroke-width:2.5}.plate{fill:#e9eef3;stroke:#253b50;stroke-width:2.5}.contact{fill:#d3eafc;stroke:#2172a5;stroke-width:3}.note{font-size:21px}</style></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="45" class="title">INSTRUCTOR REFERENCE — NOMINAL LOCAL CHECKS</text><text x="40" y="78" class="sub">Schematic / not to scale. Use the accompanying current-input dimensions and Given Data.</text><rect x="40" y="100" width="850" height="490" rx="12" class="panel"/><text x="60" y="130">FRONT VIEW / x–z</text><rect x="910" y="100" width="450" height="490" rx="12" class="panel"/><text x="930" y="130">PLAN VIEW / x–y</text>
 <rect x="100" y="360" width="720" height="60" class="plate"/><rect x="100" y="420" width="180" height="80" class="block"/><rect x="640" y="420" width="180" height="80" class="block"/><path d="M90 500H290 M630 500H830" class="line"/><text x="120" y="468">Left block</text><text x="651" y="468">Right block</text><text x="355" y="467" class="small">Open underneath</text><path d="M310 190V360H610V190" fill="#dce5ec" stroke="#253b50" stroke-width="3"/><ellipse cx="460" cy="190" rx="150" ry="22" fill="#f0f4f7" stroke="#253b50" stroke-width="3"/><line x1="460" y1="160" x2="460" y2="555" class="center"/><line x1="460" y1="112" x2="460" y2="162" class="line" marker-end="url(#arrow)"/><text x="482" y="151" class="symbol">P</text><text x="382" y="229">Cylindrical ram</text><line x1="312" y1="280" x2="608" y2="280" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="271" class="symbol" text-anchor="middle">d</text><line x1="850" y1="362" x2="850" y2="418" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="870" y="397" class="symbol" text-anchor="middle">t</text><line x1="280" y1="500" x2="280" y2="535" class="dim"/><line x1="640" y1="500" x2="640" y2="535" class="dim"/><line x1="282" y1="522" x2="638" y2="522" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="515" class="symbol" text-anchor="middle">s</text><line x1="100" y1="508" x2="100" y2="575" class="dim"/><line x1="820" y1="508" x2="820" y2="575" class="dim"/><line x1="102" y1="562" x2="818" y2="562" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="553" class="symbol" text-anchor="middle">b</text><text x="112" y="345" class="small">Intact plate</text>
 <rect x="935" y="235" width="380" height="210" class="plate"/><rect x="935" y="235" width="95" height="210" fill="#b9c9d8" fill-opacity="0.55"/><rect x="1220" y="235" width="95" height="210" fill="#b9c9d8" fill-opacity="0.55"/><line x1="1030" y1="230" x2="1030" y2="450" class="line"/><line x1="1220" y1="230" x2="1220" y2="450" class="line"/><circle cx="1125" cy="340" r="79.167" class="contact"/><line x1="1125" y1="220" x2="1125" y2="460" class="center"/><text x="1060" y="333" class="small">Circular ram</text><text x="1084" y="357" class="small">footprint</text><text x="930" y="485" class="small">Shaded outer strips: support contacts</text><text x="930" y="518" class="small">Plate and blocks extend in y beyond</text><text x="930" y="545" class="small">the complete circle; depth unassigned.</text>
 <line x1="310" y1="360" x2="310" y2="420" class="wall"/><line x1="610" y1="360" x2="610" y2="420" class="wall"/><circle cx="1125" cy="340" r="79.167" class="wall"/><line x1="720" y1="320" x2="570" y2="359" class="line" marker-end="url(#arrow)"/><text x="665" y="286" class="small">Mean contact</text><text x="665" y="310" class="small">pressure σ_b</text><rect x="40" y="620" width="710" height="350" rx="12" class="panel"/><text x="60" y="656">COMPLETE HYPOTHETICAL SURFACE</text><path d="M100 765L470 765L570 665L200 665Z" class="plate"/><path d="M100 765V835L470 835L570 735V665L470 765Z" fill="#e9eef3" fill-opacity="0.55" stroke="#788fa2" stroke-width="2"/><path d="M210 715A90 28 0 0 0 390 715L390 785A90 28 0 0 1 210 785Z" fill="#28b39a" fill-opacity="0.25" stroke="#07816e" stroke-width="3"/><ellipse cx="300" cy="785" rx="90" ry="28" class="wall"/><ellipse cx="300" cy="715" rx="90" ry="28" class="contact"/><line x1="545" y1="827" x2="381" y2="770" class="line" marker-end="url(#arrow)"/><text x="480" y="856" class="small">One cylindrical wall</text><text x="480" y="883" class="small">A_s = π d t</text><line x1="560" y1="700" x2="356" y2="710" class="line" marker-end="url(#arrow)"/><text x="550" y="690" class="small">Contact disk</text><text x="550" y="720" class="small">A_b = π d² / 4</text><text x="60" y="925" class="small">Intact plate; transparent construction indicates an imaginary surface.</text><rect x="780" y="620" width="580" height="350" rx="12" class="panel"/><text x="800" y="656">IMAGINARY CORE FREE BODY</text><path d="M925 740V850A80 25 0 0 0 1085 850V740" fill="#ddf3ed" stroke="#07816e" stroke-width="3"/><ellipse cx="1005" cy="740" rx="80" ry="25" class="contact"/><line x1="1005" y1="680" x2="1005" y2="710" class="line" marker-end="url(#arrow)"/><text x="1026" y="704" class="symbol">P</text><line x1="1140" y1="850" x2="1140" y2="740" class="line" marker-end="url(#arrow)"/><text x="1160" y="780" class="small">S_z = P</text><text x="1160" y="807" class="small">Wall resultant</text><text x="820" y="902" class="small">Lower face free. ΣF_z = 0: S_z − P = 0.</text><text x="800" y="938" class="small">Isolation is analytical; no cut or detached slug is implied.</text><text x="40" y="1015" class="note">Wall traction is not necessarily uniform. Bending, indentation, and complete fixture capacity are unverified.</text><text x="40" y="1050" class="sub">Area equations identify nominal evaluation surfaces, not a demonstrated failure mechanism or cutting process.</text></svg>
