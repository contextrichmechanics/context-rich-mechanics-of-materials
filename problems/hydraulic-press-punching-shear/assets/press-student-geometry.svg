<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Student geometry: cylindrical ram and two separate supports</title><desc id="desc">Schematic, not to scale. Current P, d, t, s, and b are supplied alongside the figure. Plate and blocks extend beyond the whole circular footprint into the page. No completed stress surfaces, equations, or numerical results are supplied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#253b50"/></marker><style>text{font-family:Arial,sans-serif;fill:#172c40;font-size:21px}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#425b70}.panel{fill:#f8fafc;stroke:#b7c6d2;stroke-width:2}.line,.dim{stroke:#253b50;stroke-width:2.5;fill:none}.symbol{font-size:26px;font-style:italic}.small{font-size:18px}.center{stroke:#95a7b7;stroke-dasharray:8 6;stroke-width:1.5}.wall{stroke:#07816e;stroke-width:3;stroke-dasharray:8 5;fill:none}.block{fill:#d4dce3;stroke:#253b50;stroke-width:2.5}.plate{fill:#e9eef3;stroke:#253b50;stroke-width:2.5}.contact{fill:#d3eafc;stroke:#2172a5;stroke-width:3}.note{font-size:21px}</style></defs><rect width="1400" height="820" fill="white"/><text x="40" y="45" class="title">STUDENT GEOMETRY — CONSTRUCT YOUR MODEL</text><text x="40" y="78" class="sub">Schematic / not to scale. Use the accompanying current-input dimensions and Given Data.</text><rect x="40" y="100" width="850" height="490" rx="12" class="panel"/><text x="60" y="130">FRONT VIEW / x–z</text><rect x="910" y="100" width="450" height="490" rx="12" class="panel"/><text x="930" y="130">PLAN VIEW / x–y</text>
 <rect x="100" y="360" width="720" height="60" class="plate"/><rect x="100" y="420" width="180" height="80" class="block"/><rect x="640" y="420" width="180" height="80" class="block"/><path d="M90 500H290 M630 500H830" class="line"/><text x="120" y="468">Left block</text><text x="651" y="468">Right block</text><text x="355" y="467" class="small">Open underneath</text><path d="M310 190V360H610V190" fill="#dce5ec" stroke="#253b50" stroke-width="3"/><ellipse cx="460" cy="190" rx="150" ry="22" fill="#f0f4f7" stroke="#253b50" stroke-width="3"/><line x1="460" y1="160" x2="460" y2="555" class="center"/><line x1="460" y1="112" x2="460" y2="162" class="line" marker-end="url(#arrow)"/><text x="482" y="151" class="symbol">P</text><text x="382" y="229">Cylindrical ram</text><line x1="312" y1="280" x2="608" y2="280" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="271" class="symbol" text-anchor="middle">d</text><line x1="850" y1="362" x2="850" y2="418" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="870" y="397" class="symbol" text-anchor="middle">t</text><line x1="280" y1="500" x2="280" y2="535" class="dim"/><line x1="640" y1="500" x2="640" y2="535" class="dim"/><line x1="282" y1="522" x2="638" y2="522" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="515" class="symbol" text-anchor="middle">s</text><line x1="100" y1="508" x2="100" y2="575" class="dim"/><line x1="820" y1="508" x2="820" y2="575" class="dim"/><line x1="102" y1="562" x2="818" y2="562" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="460" y="553" class="symbol" text-anchor="middle">b</text><text x="112" y="345" class="small">Intact plate</text>
 <rect x="935" y="235" width="380" height="210" class="plate"/><rect x="935" y="235" width="95" height="210" fill="#b9c9d8" fill-opacity="0.55"/><rect x="1220" y="235" width="95" height="210" fill="#b9c9d8" fill-opacity="0.55"/><line x1="1030" y1="230" x2="1030" y2="450" class="line"/><line x1="1220" y1="230" x2="1220" y2="450" class="line"/><circle cx="1125" cy="340" r="79.167" class="contact"/><line x1="1125" y1="220" x2="1125" y2="460" class="center"/><text x="1060" y="333" class="small">Circular ram</text><text x="1084" y="357" class="small">footprint</text><text x="930" y="485" class="small">Shaded outer strips: support contacts</text><text x="930" y="518" class="small">Plate and blocks extend in y beyond</text><text x="930" y="545" class="small">the complete circle; depth unassigned.</text>
 <rect x="40" y="620" width="1320" height="160" rx="12" class="panel"/><text x="65" y="657" class="note">The plate is intact, unbonded, and unclamped on two separate blocks.</text><text x="65" y="696" class="note">The entire circular ram footprint lies inside the clear opening in the supplied model.</text><text x="65" y="735" class="note">Use the stated assumptions and current Given Data to construct your own stress-surface model.</text></svg>
