project:
  type: website
  output-dir: _site
  render:
    - "**/*.{qmd,md,ipynb,Rmd}"
    - "!docs/reviews/**"
  resources:
    - data/problem-catalog.json
    - data/problem-catalog.js
    - data/problem-health.json
    - data/problem-health.js
    - scripts/press-fixture-model.js
    - scripts/platform-model.js
    - scripts/platform-packet.js
    - scripts/jib-crane-model.js
    - scripts/jib-crane-packet.js
    - scripts/packet-renderer.js
    - "problems/*/assets/*"

website:
  title: "Context-Rich Mechanics of Materials"
  description: "A searchable, modular database of real-world mechanics problems."
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Problem Library
      - href: instructor-builder.qmd
        text: Instructor Builder
      - href: docs/authoring-guide.qmd
        text: Authoring Guide
      - href: docs/problem-health.qmd
        text: Problem Health
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/contextrichmechanics/context-rich-mechanics-of-materials
  page-footer:
    left: "Context-Rich Mechanics of Materials Problem Library"

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    css: styles/site.css

execute:
  freeze: auto
